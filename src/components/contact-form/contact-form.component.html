<form (ngSubmit)="onSubmit()" class="space-y-6" data-testid="contact-form">
  <div>
    <label for="name" hlmLabel class="block mb-2">Name</label>
    <input
      type="text"
      id="name"
      name="name"
      hlmInput
      [(ngModel)]="formState().name"
      class="w-full"
      placeholder="Your Name"
      required
      aria-required="true"
      data-testid="contact-input-name"
    />
  </div>
  <div>
    <label for="email" hlmLabel class="block mb-2">Email</label>
    <input
      type="email"
      id="email"
      name="email"
      hlmInput
      [(ngModel)]="formState().email"
      class="w-full"
      placeholder="email@example.com"
      required
      aria-required="true"
      data-testid="contact-input-email"
    />
  </div>
  <div>
    <label for="message" hlmLabel class="block mb-2">Message</label>
    <textarea
      id="message"
      name="message"
      rows="5"
      hlmTextarea
      [(ngModel)]="formState().message"
      class="w-full resize-none"
      placeholder="Your Message..."
      required
      aria-required="true"
      data-testid="contact-input-message"
    ></textarea>
  </div>
  <div class="text-center">
    <button
      hlmBtn
      size="lg"
      type="submit"
      [disabled]="isSubmitting()"
      class="w-full sm:w-auto px-8"
      data-testid="contact-submit"
    >
      {{ isSubmitting() ? "Sending..." : "Send Message" }}
    </button>
  </div>
</form>
